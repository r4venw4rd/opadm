services:
  opadm:
    build: .
    ports:
      - "127.0.0.1:8080:8080" # dışa yalnız tunnel/proxy üzerinden aç
    environment:
      PORT: "8080"
      DB_PATH: "/data/requests.db"
      TRUST_PROXY: "1" # cloudflared başlıkları ezer; doğrudan exposure'da 0 bırak
    volumes:
      - opadm-data:/data # kalıcı volume şart: kayıplar önlenir
    restart: unless-stopped

volumes:
  opadm-data:
