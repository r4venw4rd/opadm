<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opadm — Giriş yap</title>
<meta name="description" content="opadm hesabına giriş yap, canlı demo ve durum panelini aç.">
<link rel="stylesheet" href="/style.css">
<script>try{var t=localStorage.getItem("opadm-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<script src="/theme.js" defer></script>
<script src="/auth.js" defer></script>
</head>
<body>
<a class="skip" href="#login-heading">Giriş formuna atla</a>
<div class="bg-fx" aria-hidden="true"></div>

<header class="wrap site-header">
  <p class="brand"><a href="/" aria-label="opadm ana sayfa"><span class="brand-mark" aria-hidden="true">$</span> opadm</a></p>
  <nav aria-label="Sayfa bölümleri">
    <a href="/signup/">Üye ol</a>
    <button class="theme-btn" type="button" id="theme-btn" aria-label="Açık temaya geç">☾</button>
  </nav>
</header>

<main class="wrap">
  <section aria-labelledby="login-heading">
    <h1 id="login-heading">Giriş yap</h1>
    <p class="sec-sub">Giriş yapınca canlı durum ve demo paneli açılır.</p>
    <div class="status-panel">
      <form id="login-form" novalidate>
        <div class="field">
          <label for="li-email">E-posta</label>
          <input id="li-email" type="email" inputmode="email" autocomplete="email" required maxlength="254" aria-describedby="li-err">
        </div>
        <div class="field">
          <label for="li-pass">Parola</label>
          <input id="li-pass" type="password" autocomplete="current-password" required aria-describedby="li-err">
        </div>
        <p class="err" id="li-err" hidden></p>
        <button class="btn btn-primary" type="submit" id="login-btn">Giriş yap</button>
      </form>
      <p>Hesabın yok mu? <a href="/signup/">Üye ol</a></p>
      <p id="account-msg" role="status" aria-live="polite"></p>
    </div>
  </section>
</main>

<footer class="wrap site-footer">
  <p><span class="brand-mark" aria-hidden="true">$</span> <strong>opadm</strong> — küçük ekipler için sunucu bakımı.</p>
  <p class="foot-dim">Bu sayfa değerlendirme amaçlı kurgusal bir hizmettir; gerçek talep toplanmaz.</p>
</footer>
</body>
</html>
