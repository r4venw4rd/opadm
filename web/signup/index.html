<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opadm — Üye ol</title>
<meta name="description" content="opadm hesabı aç, canlı demo ve durum panelini dene.">
<link rel="stylesheet" href="/style.css">
<script>try{var t=localStorage.getItem("opadm-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<script src="/theme.js" defer></script>
<script src="/auth.js" defer></script>
</head>
<body>
<a class="skip" href="#signup-heading">Üyelik formuna atla</a>
<div class="bg-fx" aria-hidden="true"></div>

<header class="wrap site-header">
  <p class="brand"><a href="/" aria-label="opadm ana sayfa"><span class="brand-mark" aria-hidden="true">$</span> opadm</a></p>
  <nav aria-label="Sayfa bölümleri">
    <a href="/login/">Giriş yap</a>
    <button class="theme-btn" type="button" id="theme-btn" aria-label="Açık temaya geç">☾</button>
  </nav>
</header>

<main class="wrap">
  <section aria-labelledby="signup-heading">
    <h1 id="signup-heading">Üye ol</h1>
    <p class="sec-sub">Üyelik açılır açılmaz giriş yapılır, panel açılır.</p>
    <div class="status-panel">
      <form id="signup-form" novalidate>
        <div class="field">
          <label for="su-email">E-posta</label>
          <input id="su-email" type="email" inputmode="email" autocomplete="email" required maxlength="254" aria-describedby="su-err">
        </div>
        <div class="field">
          <label for="su-pass">Parola (8-128 karakter)</label>
          <input id="su-pass" type="password" autocomplete="new-password" required minlength="8" maxlength="128" aria-describedby="su-err">
        </div>
        <p class="err" id="su-err" hidden></p>
        <button class="btn btn-primary" type="submit" id="signup-btn">Üye ol</button>
      </form>
      <p>Hesabın var mı? <a href="/login/">Giriş yap</a></p>
      <p id="account-msg" role="status" aria-live="polite"></p>
    </div>
  </section>
</main>

<footer class="wrap site-footer">
  <p><span class="brand-mark" aria-hidden="true">$</span> <strong>opadm</strong> — küçük ekipler için sunucu bakımı.</p>
  <p class="foot-dim">Bu sayfa değerlendirme amaçlı kurgusal bir hizmettir; gerçek talep toplanmaz.</p>
</footer>
</body>
</html>
